# -------------------------------------------------------------------
# Local analysis patterns (Phase 3 — applied to cloned repos)
# Ordered roughly by specificity (most precise first).
# -------------------------------------------------------------------

patterns:

  # ===== C/C++ — libFuzzer =====

  - id: "libfuzzer_entrypoint"
    label: "libFuzzer entry point: LLVMFuzzerTestOneInput"
    regex: "\\bLLVMFuzzerTestOneInput\\b"

  - id: "libfuzzer_initialize"
    label: "libFuzzer optional init: LLVMFuzzerInitialize"
    regex: "\\bLLVMFuzzerInitialize\\b"

  - id: "libfuzzer_run_driver"
    label: "libFuzzer library mode: LLVMFuzzerRunDriver"
    regex: "\\bLLVMFuzzerRunDriver\\b"

  - id: "fuzzed_data_provider"
    label: "libFuzzer: FuzzedDataProvider"
    regex: "\\bFuzzedDataProvider\\b"

  - id: "include_fuzzer_header"
    label: "Include: fuzzer/FuzzedDataProvider.h"
    regex: "#include\\s+[<\"]fuzzer/"

  - id: "fsanitize_fuzzer"
    label: "Compiler flag: -fsanitize=fuzzer"
    regex: "-fsanitize=fuzzer(?:-no-link)?"

  - id: "fuzzing_build_mode"
    label: "Preprocessor: FUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION"
    regex: "\\bFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION\\b"

  # ===== C/C++ — AFL / AFL++ =====

  - id: "afl_fuzz_init"
    label: "AFL++: __AFL_FUZZ_INIT persistent mode"
    regex: "__AFL_FUZZ_INIT\\b"

  - id: "afl_loop"
    label: "AFL++: __AFL_LOOP persistent mode"
    regex: "__AFL_LOOP\\s*\\("

  - id: "afl_testcase_buf"
    label: "AFL++: __AFL_FUZZ_TESTCASE_BUF / _LEN"
    regex: "__AFL_FUZZ_TESTCASE_(?:BUF|LEN)\\b"

  - id: "afl_manual_control"
    label: "AFL: __AFL_HAVE_MANUAL_CONTROL deferred forkserver"
    regex: "__AFL_HAVE_MANUAL_CONTROL\\b"

  - id: "afl_compiler"
    label: "AFL: afl-clang-fast / afl-gcc / afl-fuzz compiler wrapper"
    regex: "\\bafl-(?:fuzz|gcc|clang(?:-fast)?|cc|as|tmin|cmin|showmap|analyze)\\b"

  # ===== C — honggfuzz =====

  - id: "honggfuzz_hf_iter"
    label: "honggfuzz: HF_ITER persistent mode"
    regex: "\\bHF_ITER\\s*\\("

  - id: "honggfuzz_include"
    label: "honggfuzz: #include libhfuzz"
    regex: "#include\\s+[\"<]libhfuzz/"

  - id: "hfuzz_compiler"
    label: "honggfuzz: hfuzz-clang / hfuzz-gcc compiler"
    regex: "\\bhfuzz-(?:clang(?:\\+\\+)?|gcc|g\\+\\+)\\b"

  # ===== Rust — cargo-fuzz / libfuzzer-sys =====

  - id: "rust_fuzz_target_macro"
    label: "Rust cargo-fuzz: fuzz_target! macro"
    regex: "\\bfuzz_target!\\s*\\("

  - id: "rust_libfuzzer_sys"
    label: "Rust: use / extern crate libfuzzer_sys"
    regex: "(?:use|extern crate)\\s+libfuzzer_sys\\b"

  - id: "rust_cargo_fuzz_toml"
    label: "Rust: cargo-fuzz = true in Cargo.toml"
    regex: "cargo-fuzz\\s*=\\s*true"

  # ===== Go — native fuzzing (Go 1.18+) =====

  - id: "go_fuzz_func"
    label: "Go: func FuzzXxx(*testing.F) entry point"
    regex: "func\\s+Fuzz\\w+\\s*\\(\\s*\\w+\\s*\\*testing\\.F\\s*\\)"

  - id: "go_testing_f_method"
    label: "Go: f.Fuzz( / f.Add( calls"
    regex: "\\bf\\.(?:Fuzz|Add)\\s*\\("

  - id: "go_fuzz_corpus_header"
    label: "Go: 'go test fuzz v1' corpus file header"
    regex: "go test fuzz v1"

  # ===== Go — go-fuzz (dvyukov, pre-1.18) =====

  - id: "go_fuzz_legacy_func"
    label: "go-fuzz: func Fuzz(data []byte) int"
    regex: "func\\s+Fuzz\\s*\\(\\s*data\\s*\\[\\]byte\\s*\\)\\s*int"

  - id: "go_fuzz_build_tag"
    label: "go-fuzz: build tag gofuzz"
    regex: "(?://go:build|//\\s*\\+build)\\s+gofuzz"

  - id: "go_fuzz_build_cmd"
    label: "go-fuzz: go-fuzz-build CLI"
    regex: "\\bgo-fuzz(?:-build)?\\b"

  # ===== Java — Jazzer =====

  - id: "jazzer_fuzz_test_annotation"
    label: "Jazzer: @FuzzTest annotation (JUnit 5 mode)"
    regex: "@FuzzTest\\b"

  - id: "jazzer_entry_point"
    label: "Jazzer: fuzzerTestOneInput standalone"
    regex: "\\bfuzzerTestOneInput\\b"

  - id: "jazzer_import"
    label: "Jazzer: import com.code_intelligence.jazzer"
    regex: "import\\s+com\\.code_intelligence\\.jazzer"

  - id: "jazzer_security_issue"
    label: "Jazzer: FuzzerSecurityIssue{High,Medium,Low,Critical}"
    regex: "\\bFuzzerSecurityIssue(?:High|Medium|Low|Critical)\\b"

  - id: "jazzer_fuzzed_data_provider_java"
    label: "Jazzer: FuzzedDataProvider (Java)"
    regex: "\\bFuzzedDataProvider\\b"

  # ===== Python — atheris =====

  - id: "import_atheris"
    label: "Import: atheris (Python coverage-guided fuzzer)"
    regex: "(?:import atheris|from atheris)"

  - id: "atheris_setup"
    label: "atheris.Setup / atheris.Fuzz call"
    regex: "\\batheris\\.(?:Setup|Fuzz|instrument_(?:imports|func|all))\\b"

  # ===== Python — python-afl =====

  - id: "python_afl_import"
    label: "python-afl: import afl module"
    regex: "\\bimport afl\\b"

  - id: "python_afl_calls"
    label: "python-afl: afl.init() / afl.loop()"
    regex: "\\bafl\\.(?:init|loop)\\s*\\("

  # ===== Python — pythonfuzz =====

  - id: "pythonfuzz_import"
    label: "pythonfuzz: from pythonfuzz import"
    regex: "from\\s+pythonfuzz(?:\\.main)?\\s+import"

  - id: "pythonfuzz_decorator"
    label: "pythonfuzz: @PythonFuzz decorator"
    regex: "@PythonFuzz\\b"

  # ===== Python — boofuzz (protocol/network fuzzing) =====

  - id: "import_boofuzz"
    label: "Import: boofuzz (protocol fuzzer)"
    regex: "(?:import boofuzz|from boofuzz)"

  - id: "boofuzz_session"
    label: "boofuzz: Session( / session.fuzz()"
    regex: "\\b(?:Session\\s*\\(|session\\.fuzz\\s*\\()"

  - id: "boofuzz_s_initialize"
    label: "boofuzz: s_initialize( message builder"
    regex: "\\bs_initialize\\s*\\("

  # ===== OSS-Fuzz / build infrastructure =====

  - id: "lib_fuzzing_engine"
    label: "OSS-Fuzz: $LIB_FUZZING_ENGINE env variable"
    regex: "\\$(?:\\{)?LIB_FUZZING_ENGINE(?:\\})?"

  - id: "ossfuzz_out"
    label: "OSS-Fuzz: $OUT fuzzer output dir"
    regex: "\\$(?:\\{)?OUT(?:\\})?/\\w"

  - id: "compile_go_fuzzer"
    label: "OSS-Fuzz: compile_go_fuzzer helper"
    regex: "\\bcompile_go_fuzzer\\b"

  # ===== Lower-specificity generic patterns =====

  - id: "identifier_fuzz_target"
    label: "Identifier: FuzzTarget / fuzz_target"
    regex: "\\b(?:FuzzTarget|fuzz_target)\\b"

  - id: "identifier_fuzz_test"
    label: "Identifier: FuzzTest / fuzz_test"
    regex: "\\b(?:FuzzTest|fuzz_test)\\b"

  - id: "string_coverage_guided"
    label: "String/comment: coverage-guided fuzzing"
    regex: "coverage[-.\\s]guided\\s+fuzzing"
    flags: "IGNORECASE"

  - id: "comment_fuzz"
    label: "Comment: fuzz testing / fuzzing"
    regex: "(?:#|//).*\\bfuzz(?:ing|\\s+test(?:ing|s)?)\\b"
    flags: "IGNORECASE"

