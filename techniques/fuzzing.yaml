# -------------------------------------------------------------------
domain_keywords:
  security:               ["security", "vulnerability", "exploit", "cve", "bug-bounty", "pentest", "sanitizer"]
  compiler:               ["compiler", "parser", "interpreter", "llvm", "clang", "gcc", "ast"]
  networking:             ["protocol", "network", "http", "tcp", "socket", "packet", "rpc"]
  testing_infrastructure: ["testing", "fuzzer", "harness", "oss-fuzz", "ci-fuzz", "clusterfuzz"]
  systems:                ["kernel", "driver", "os", "syscall", "firmware", "embedded"]
  database:               ["database", "sql", "query", "storage", "index"]

