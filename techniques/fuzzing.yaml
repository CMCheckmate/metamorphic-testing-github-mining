# Technique profile: Fuzz Testing (Fuzzing)
# Coverage-guided and mutation-based fuzzing: inputs are generated/mutated to
# trigger crashes, assertion failures, and security vulnerabilities.
# Primary tools: libFuzzer, AFL/AFL++, honggfuzz, cargo-fuzz, Go testing.F,
# Jazzer, atheris, boofuzz, go-fuzz, OSS-Fuzz, syzkaller.

name: "Fuzz Testing"
short_name: "Fuzzing"
slug: "fuzzing"
description: >
  A dynamic testing technique that feeds semi-random, malformed, or mutation-derived
  inputs to a program to trigger crashes, assertion failures, and security vulnerabilities.
  Includes coverage-guided (libFuzzer, AFL++, honggfuzz), language-native (Go testing.F,
  cargo-fuzz, Jazzer), and protocol-based (boofuzz) approaches.
color: "#b71c1c"

# -------------------------------------------------------------------
# Search vocabulary
# These drive GitHub full-text and topic search.
# "fuzzy" / "fuzzy testing" deliberately excluded: it matches fuzzy-logic
# and string-similarity libraries (thefuzz/fuzzywuzzy) with near-zero
# overlap with actual fuzz testing.
# -------------------------------------------------------------------

search_phrases:
  - "fuzz testing"
  - "fuzz test"
  - "fuzzing"
  - "coverage-guided fuzzing"
  - "coverage guided fuzzing"
  - "greybox fuzzing"
  - "grey-box fuzzing"
  - "blackbox fuzzing"
  - "black-box fuzzing"
  - "grammar-based fuzzing"
  - "grammar based fuzzing"
  - "structure-aware fuzzing"
  - "structure aware fuzzing"
  - "fuzz target"
  - "fuzz harness"
  - "fuzz corpus"
  - "libfuzzer"
  - "cargo-fuzz"

# identifiers are used for code-surface GitHub search (exact string match).
# "AFL" and "AFL++" deliberately excluded: too many unrelated acronym matches
# (e.g. Australian Football League, AFL-CIO). __AFL_FUZZ_INIT is unambiguous.
identifiers:
  # C/C++ — libFuzzer
  - "LLVMFuzzerTestOneInput"
  - "LLVMFuzzerInitialize"
  - "FuzzedDataProvider"
  - "FUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION"
  - "-fsanitize=fuzzer"
  # C/C++ — AFL/AFL++ (persistent-mode macros, near-zero false positives)
  - "__AFL_FUZZ_INIT"
  - "__AFL_LOOP"
  - "__AFL_FUZZ_TESTCASE_BUF"
  - "afl-fuzz"
  - "afl-clang-fast"
  # C — honggfuzz
  - "HF_ITER"
  - "honggfuzz"
  # Rust — cargo-fuzz / libfuzzer-sys
  - "libfuzzer-sys"
  - "cargo-fuzz"
  # Go — native (1.18+)
  - "testing.F"
  # Go — go-fuzz (pre-1.18, dvyukov)
  - "go-fuzz-build"
  # Java — Jazzer
  - "fuzzerTestOneInput"
  - "com.code_intelligence.jazzer"
  - "FuzzerSecurityIssueMedium"
  - "FuzzerSecurityIssueCritical"
  # Python
  - "atheris"
  - "boofuzz"
  # Infrastructure
  - "OSS-Fuzz"
  - "syzkaller"
  - "ClusterFuzz"

