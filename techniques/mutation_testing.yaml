# Technique profile: Mutation Testing
# Mutation testing evaluates the quality of a test suite by injecting small
# artificial faults (mutants) into the source code and checking whether the tests
# detect them. Comparison with MT is instructive because both amplify test coverage,
# but MT works from input relations while mutation testing works from code faults.

name: "Mutation Testing"
short_name: "MutTest"
slug: "mutation_testing"
description: >
  A test adequacy technique that introduces small artificial faults (mutants) into source
  code and measures what fraction of mutants the test suite can detect (kill).
color: "#e65100"

