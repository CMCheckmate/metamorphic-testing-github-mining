# Lemmatization
# -------------------------------------------------------------------
lemmatization:
  trigger: ""   # disabled — mutation/mutant regex coverage is sufficient

# -------------------------------------------------------------------
# Report customization
# -------------------------------------------------------------------
extra_report_sections:
  - "framework_vs_adopter"

report_intro: |
  **Mutation Testing** is a test adequacy technique that evaluates how thoroughly a test suite
  exercises the source code by introducing small, syntactically valid *artificial faults*
  (mutants) — e.g. replacing `>` with `>=`, deleting a statement, or negating a condition.

  A test suite "kills" a mutant if at least one test fails for the mutated program. The
  **mutation score** (killed ÷ total mutants) measures test suite quality beyond simple
  code coverage.

  Key tools: **PIT** (Java), **mutmut** (Python), **Stryker** (JS/TS/Java), **cosmic-ray**
  (Python), **cargo-mutants** (Rust), and **MutPy** (Python).

  Compared to Metamorphic Testing, mutation testing evaluates *test suite quality* (are
  your tests good?) whereas MT generates *new test cases* (find new bugs). Both techniques
  complement each other in a comprehensive testing strategy.
