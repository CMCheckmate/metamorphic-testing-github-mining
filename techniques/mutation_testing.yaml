# -------------------------------------------------------------------
# Local analysis patterns (Phase 3)
# -------------------------------------------------------------------

patterns:
  # --- Python mutmut ---
  - id: "import_mutmut"
    label: "Import: mutmut"
    regex: "(?:import mutmut|from mutmut)"

  # --- Python mutatest ---
  - id: "import_mutatest"
    label: "Import: mutatest"
    regex: "(?:import mutatest|from mutatest)"

  # --- Python cosmic-ray ---
  - id: "import_cosmicray"
    label: "Import: cosmic_ray / cosmicray"
    regex: "(?:import cosmic_ray|from cosmic_ray|import cosmicray)"

  # --- Java PIT (Pitest) — Maven/Gradle config ---
  - id: "pitest_plugin"
    label: "Build config: pitest / PIT plugin"
    regex: "(?:pitest|org\\.pitest)"
    flags: "IGNORECASE"

  # --- JavaScript Stryker ---
  - id: "stryker_config"
    label: "Stryker config / import"
    regex: "(?:stryker|@stryker-mutator)"
    flags: "IGNORECASE"

  # --- Rust cargo-mutants ---
  - id: "cargo_mutants"
    label: "Rust: cargo-mutants"
    regex: "cargo.mutants|cargo_mutants"
    flags: "IGNORECASE"

  # --- Generic mutation testing identifiers ---
  - id: "identifier_mutation_score"
    label: "Identifier: mutation_score"
    regex: "\\bmutation_score\\b"

  - id: "identifier_mutant"
    label: "Identifier: MutationOperator / mutant classes"
    regex: "\\bMutation(?:Operator|Tester|Score|Analysis)\\w*\\b"

  - id: "identifier_killed_mutants"
    label: "Identifier: killed_mutants / survived_mutants"
    regex: "\\b(?:killed|survived)_mutants\\b"

  # --- String literals ---
  - id: "string_mutation_testing"
    label: 'String: "mutation testing/analysis"'
    regex: '"[Mm]utation\\s+(?:test(?:ing|s)?|analysis|score|operator)"'

  - id: "string_mutant_kill"
    label: 'String: "killing mutants" / "mutant killed"'
    regex: '"(?:[Kk]ill(?:ing)?\\s+mutants?|[Mm]utant\\s+killed)"'

  # --- Comments ---
  - id: "comment_mutation_testing"
    label: "Comment: mutation testing"
    regex: "(?:#|//).*\\bmutation\\s+test(?:ing|s|er)?\\b"
    flags: "IGNORECASE"

  - id: "comment_mutant"
    label: "Comment: mutant / mutation operator"
    regex: "(?:#|//).*\\b(?:mutants?|mutation\\s+operator)\\b"
    flags: "IGNORECASE"

  - id: "comment_mutation_score"
    label: "Comment: mutation score"
    regex: "(?:#|//).*\\bmutation\\s+score\\b"
    flags: "IGNORECASE"

