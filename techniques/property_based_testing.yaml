# Technique profile: Property-Based Testing (PBT)
# PBT is a generalization of which Metamorphic Testing (MT) is a specific form.
# A PBT framework generates random inputs that satisfy a stated property;
# MT is PBT applied to the oracle problem via metamorphic relations.
# This profile covers the broader PBT ecosystem to provide comparison context for MT research.

name: "Property-Based Testing"
short_name: "PBT"
slug: "property_based_testing"
description: >
  A testing approach where test cases are generated automatically to verify high-level
  properties (invariants) that should hold for all valid inputs.
color: "#1565c0"
# -------------------------------------------------------------------
# Search vocabulary
# -------------------------------------------------------------------
#
# Rule: search_phrases / identifiers are matched against GitHub's search
# index (millions of repos). Only use terms that are specific enough to
# reliably identify PBT usage without flooding results with false positives.
#
# Generic terms (generative testing, randomized testing, shrinking,
# invariant, arbitrary, model-based testing) and short identifiers that
# collide with unrelated code (@given, @settings, forAll, Arbitrary,
# hypothesis, QuickCheck, prop_test, property_test, Gen.arbitrary) belong
# ONLY in the local-analysis patterns section below, not here.

search_phrases:
  # Core PBT phrase family — all lemma variants (singular / plural / gerund,
  # hyphenated and unhyphenated spellings)
  - "property-based testing"
  - "property-based test"
  - "property-based tests"
  - "property based testing"
  - "property based test"
  - "property based tests"
  - "property-based tests"
  - "generative testing"
  - "generator based testing"
  - "invariant based testing"
  - "randomized testing"
  - "random test generation"
  - "shrinking strategy"
  - "test shrinkage"
  - "arbitrary test data"
  - "model based testing"
  - "QuickCheck testing"

identifiers:
  # Import patterns rather than bare library names — far more precise for code search.
  # Generic API names (@given, @settings, forAll, Arbitrary, etc.) are excluded here
  # and belong in the patterns section only.

  # Python — Hypothesis
  - "import hypothesis"
  - "from hypothesis import given"
  # Scala — ScalaCheck
  - "import org.scalacheck"
  # F# — FsCheck
  - "open FsCheck"
  # C# — FsCheck
  - "using FsCheck"
  # Java — jqwik
  - "import net.jqwik"
  # JavaScript / TypeScript — fast-check (hyphenated name is specific in import/require context)
  - "fast-check"
  # Rust — proptest
  - "use proptest"
  # Erlang / Elixir — PropEr (distinctive capitalisation; Elixir wrapper is PropCheck)
  - "PropEr"
  # Go — gopter (full module path is unambiguous)
  - "leanovate/gopter"

extra_queries:
  repos:
    - query: "topic:property-based-testing"
      label: "repo_pbt_topic"
    - query: "topic:quickcheck"
      label: "repo_quickcheck_topic"
    - query: "topic:scalacheck"
      label: "repo_scalacheck_topic"
    - query: "topic:jqwik"
      label: "repo_jqwik_topic"
    - query: "topic:proptest"
      label: "repo_proptest_topic"
    - query: '"property-based testing framework"'
      label: "repo_pbt_framework"
  code: []
  issues: []
  commits: []
  discussions: []

# -------------------------------------------------------------------
# Local analysis patterns (Phase 3)
# -------------------------------------------------------------------

patterns:
  # --- Python Hypothesis ---
  - id: "import_hypothesis"
    label: "Import: hypothesis library"
    regex: "(?:import hypothesis|from hypothesis)"

  - id: "decorator_given"
    label: "Decorator: @given (Hypothesis)"
    regex: "@given\\s*\\("
    scope: "block"

  - id: "decorator_settings"
    label: "Decorator: @settings (Hypothesis)"
    regex: "@settings\\s*\\("

  - id: "hypothesis_strategies"
    label: "Hypothesis strategies (st.*)"
    regex: "\\bst\\.(?:integers|text|floats|booleans|lists|dictionaries|composite|one_of|builds)\\b"

  # --- Haskell / Rust / Python QuickCheck ---
  - id: "import_quickcheck"
    label: "Import: quickcheck"
    regex: "(?i)(?:import|use|require|extern crate)\\s+quickcheck"

  - id: "class_Arbitrary"
    label: "Class/trait: Arbitrary"
    regex: "\\bArbitrary\\b"

  # --- ScalaCheck ---
  - id: "import_scalacheck"
    label: "Import: ScalaCheck"
    regex: "(?:import|use)\\s+org\\.scalacheck"

  - id: "forAll_method"
    label: "Method: forAll (ScalaCheck/QuickCheck)"
    regex: "\\bforAll\\s*\\("

  # --- Java jqwik ---
  - id: "annotation_Property"
    label: "Annotation: @Property (jqwik)"
    regex: "@Property\\b"
    scope: "block"

  - id: "annotation_ForAll"
    label: "Annotation: @ForAll (jqwik)"
    regex: "@ForAll\\b"

  # --- JavaScript fast-check ---
  - id: "import_fast_check"
    label: "Import: fast-check"
    regex: "(?:require|from)\\s+['\"]fast-check['\"]"

  - id: "fc_property"
    label: "fast-check: fc.property / fc.assert"
    regex: "\\bfc\\.(?:property|assert|check|anything|integer|string|array)\\b"

  # --- Rust proptest ---
  - id: "proptest_macro"
    label: "proptest! macro (Rust)"
    regex: "\\bproptest!\\s*\\{"
    scope: "block"

  - id: "import_proptest"
    label: "Import: proptest (Rust)"
    regex: "use\\s+proptest"

  # --- F# FsCheck ---
  - id: "import_fscheck"
    label: "Import: FsCheck"
    regex: "open\\s+FsCheck"

  # --- Java jqwik ---
  - id: "import_jqwik"
    label: "Import: jqwik (net.jqwik)"
    regex: "import\\s+net\\.jqwik"

  # --- Erlang / Elixir PropEr ---
  - id: "import_proper"
    label: "Import/use: PropEr"
    regex: "(?:-include_lib\\s*\\(\"proper/include/proper\\.hrl\"\\)|\\buse\\s+PropCheck\\b|\\bimport PropCheck\\b|\\bproper\\.quickcheck\\b|\\bprop_statem\\b)"

  # --- Go gopter ---
  - id: "import_gopter"
    label: "Import: gopter"
    regex: "\"github\\.com/leanovate/gopter"

  # --- Generic identifiers ---
  - id: "identifier_property_test"
    label: "Identifier: property_test / prop_test"
    regex: "\\b(?:property_test|prop_test)\\w*\\b"

  # --- String literals ---
  - id: "string_pbt_phrase"
    label: 'String: "property-based testing/test"'
    regex: '"[Pp]roperty.based\\s+test(?:ing|s)?"'

  - id: "string_quickcheck_phrase"
    label: 'String: "QuickCheck"'
    regex: '"QuickCheck"'

  # --- Comments ---
  - id: "comment_pbt"
    label: "Comment: property-based testing"
    regex: "(?:#|//).*\\bproperty.based\\s+test(?:ing|s)?\\b"
    flags: "IGNORECASE"

  - id: "comment_invariant"
    label: "Comment: invariant testing"
    regex: "(?:#|//).*\\binvariant\\s+test(?:ing|s)?\\b"
    flags: "IGNORECASE"

  - id: "comment_generative"
    label: "Comment: generative testing"
    regex: "(?:#|//).*\\bgenerative\\s+test(?:ing|s)?\\b"
    flags: "IGNORECASE"

  # --- Abbreviation ---
  - id: "abbrev_PBT"
    label: "Abbreviation: PBT (property-based testing)"
    regex: "(?<![A-Za-z0-9])PBT(?![A-Za-z0-9])"

# -------------------------------------------------------------------
# Lemmatization
# -------------------------------------------------------------------
lemmatization:
  trigger: "" # disabled — "property" is too common a word for trigger-based filtering

