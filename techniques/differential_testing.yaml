# Local analysis patterns (Phase 3)
# -------------------------------------------------------------------

patterns:
  # --- Class / type names ---
  - id: "class_DifferentialTest"
    label: "Class name: DifferentialTest"
    regex: "\\bDifferential(?:Test|Fuzzer|Checker|Oracle)\\w*\\b"

  - id: "class_TestOracle"
    label: "Class name: TestOracle / OracleTest"
    regex: "\\b(?:Test|Oracle)Oracle\\w*\\b|\\bOracleTest\\w*\\b"

  # --- Identifier patterns ---
  - id: "identifier_differential_test"
    label: "Identifier: differential_test / differential_fuzz"
    regex: "\\bdifferential_(?:test|fuzz)\\w*\\b"

  - id: "identifier_test_oracle"
    label: "Identifier: test_oracle / TestOracle"
    regex: "\\btest_oracle\\w*\\b"

  - id: "identifier_compare_outputs"
    label: "Identifier: compare_outputs / cross_check"
    regex: "\\b(?:compare_outputs|cross_check|cross_validate)\\b"

  - id: "identifier_ref_impl"
    label: "Identifier: reference_impl / RefImpl"
    regex: "\\b(?:reference_impl|RefImpl|ref_impl)\\b"

  # --- csmith / yarpgen (C/C++ compiler differential testing) ---
  - id: "csmith_tool"
    label: "csmith / yarpgen (compiler differential testing tools)"
    regex: "\\b(?:csmith|yarpgen)\\b"

  # --- String literals ---
  - id: "string_differential_testing"
    label: 'String: "differential testing/fuzzing"'
    regex: '"[Dd]ifferential\\s+(?:test(?:ing|s)?|fuzz(?:ing)?)"'

  - id: "string_oracle_problem"
    label: 'String: "oracle problem" / "test oracle"'
    regex: '"(?:[Tt]est\\s+oracle|[Oo]racle\\s+problem|[Pp]seudo.oracle)"'

  - id: "string_n_version"
    label: 'String: "n-version testing"'
    regex: '"[Nn].version\\s+test(?:ing|s)?"'

  # --- Comments ---
  - id: "comment_differential"
    label: "Comment: differential testing/fuzzing"
    regex: "(?:#|//).*\\bdifferential\\s+(?:test(?:ing|s)?|fuzz(?:ing)?)\\b"
    flags: "IGNORECASE"

  - id: "comment_oracle_problem"
    label: "Comment: oracle problem / test oracle"
    regex: "(?:#|//).*\\b(?:oracle\\s+problem|test\\s+oracle|pseudo.oracle)\\b"
    flags: "IGNORECASE"

  - id: "comment_cross_check"
    label: "Comment: cross-checking / cross-validation"
    regex: "(?:#|//).*\\bcross.check(?:ing)?\\b"
    flags: "IGNORECASE"

  # --- Abbreviation ---
  - id: "abbrev_DT"
    label: "Abbreviation: DT (differential testing)"
    regex: "(?<![A-Za-z0-9])DT(?![A-Za-z0-9])"

