# Technique profile: Differential Testing
# Differential testing detects bugs by running multiple implementations of the same
# specification and comparing their outputs for the same inputs. When outputs diverge,
# one (or more) implementations has a bug. It is closely related to MT in that
# both avoid the oracle problem by comparing outputs rather than checking against a
# fixed expected value — differential testing uses a "pseudo-oracle" (another implementation).

name: "Differential Testing"
short_name: "DiffTest"
slug: "differential_testing"
description: >
  A testing technique that runs two or more implementations of the same specification on
  identical inputs and flags divergences as potential bugs — using one implementation as
  a pseudo-oracle for the other.
color: "#6a1b9a"

