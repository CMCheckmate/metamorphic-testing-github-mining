report_intro: |
  **Differential Testing** detects bugs by running two or more implementations of the same
  specification on identical inputs and comparing their outputs. When outputs diverge, at
  least one implementation has a bug. One implementation acts as a *pseudo-oracle* for the
  other, sidestepping the need for a formal specification.

  Classic applications include: compiler testing (CSmith, YARPGen — run multiple C compilers
  on the same program), JVM testing, database engine testing, browser engine testing, and
  comparing production vs. shadow systems.

  Differential testing is closely related to **Metamorphic Testing**: both avoid the oracle
  problem, but MT uses *relational properties of inputs/outputs* while differential testing
  uses *agreement between multiple implementations*. Many real-world systems combine both.
