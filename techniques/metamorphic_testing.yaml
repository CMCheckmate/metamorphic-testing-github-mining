# Technique profile: Metamorphic Testing (MT)
# This is the primary technique for the research project.
# It receives extra report sections (oracle problem context, framework/adopter analysis)
# in addition to the generic Q1-Q8 sections all techniques share.

name: "Metamorphic Testing"
short_name: "MT"
slug: "metamorphic_testing"
description: >
  A testing technique that defines metamorphic relations (MRs) between inputs and outputs
  to detect bugs when a test oracle is absent or expensive.
color: "#1a6e3c"

# -------------------------------------------------------------------
# Search vocabulary
# -------------------------------------------------------------------

# Natural-language phrases — each will be wrapped in double quotes
# for exact GitHub search matching.
search_phrases:
  - "metamorphic testing"
  - "metamorphic test"
  - "metamorphic tests"
  - "metamorphic relation"
  - "metamorphic relations"
  - "metamorphic relationship"
  - "metamorphic relationships"
  - "metamorphic property"
  - "metamorphic properties"
  - "metamorphic group"
  - "metamorphic groups"
  - "metamorphic oracle"

# Code-level identifiers — class names, snake_case names, decorators.
identifiers:
  - "MetamorphicTest"
  - "MetamorphicRelation"
  - "metamorphic_relation"
  - "metamorphic_relations"
  - "metamorphic_test"
  - "metamorphic_tests"
  - "@metamorphic"

# Extra queries added verbatim to auto-generated query lists.
extra_queries:
  repos:
    - query: '"metamorphic testing framework"'
      label: "repo_mt_framework"
    - query: "topic:metamorphic-testing"
      label: "repo_topic"
  issues:
    - query: '"metamorphic testing framework"'
      label: "issue_mt_framework"
      kind: "issue"
  code: []
  commits: []
  discussions: []

# Domain hints — these domains are expected to be over-represented for MT
# (used for context in combined report, not for filtering)
domain_hints:
  - machine_learning
  - scientific
  - compiler

# -------------------------------------------------------------------
# Local analysis patterns (Phase 3)
# -------------------------------------------------------------------
# Each pattern is matched against every source file in cloned repos.
# regex: raw Python regex string (YAML backslashes must be doubled)
# flags: optional "IGNORECASE" or "MULTILINE"

patterns:
  # --- Class / type names used by MT frameworks ---
  - id: "class_MetamorphicTest"
    label: "Class name: MetamorphicTest"
    regex: "\\bMetamorphicTest\\w*\\b"
    scope: "block"

  - id: "class_MetamorphicRelation"
    label: "Class name: MetamorphicRelation"
    regex: "\\bMetamorphicRelation\\w*\\b"
    scope: "block"

  # --- Decorator used by Python MT libraries ---
  - id: "decorator_metamorphic"
    label: "Decorator: @metamorphic"
    regex: "@metamorphic\\b"
    scope: "block"

  # --- Snake_case identifiers common in MT code ---
  - id: "identifier_mr"
    label: "Identifier: metamorphic_relation"
    regex: "\\bmetamorphic_relation\\w*\\b"

  - id: "identifier_mt"
    label: "Identifier: metamorphic_test"
    regex: "\\bmetamorphic_test\\w*\\b"

  # --- String literals containing MT phrases ---
  - id: "string_mt_phrase"
    label: 'String: "metamorphic test/testing/tests"'
    regex: '"[Mm]etamorphic\\s+[Tt]est(?:ing|s)?"'

  - id: "string_mr_phrase"
    label: 'String: "metamorphic relation/relationship"'
    regex: '"[Mm]etamorphic\\s+[Rr]elation(?:s|ship|ships)?"'

  - id: "string_mg_phrase"
    label: 'String: "metamorphic group/groups"'
    regex: '"[Mm]etamorphic\\s+[Gg]roups?"'

  - id: "string_mp_phrase"
    label: 'String: "metamorphic property/properties"'
    regex: '"[Mm]etamorphic\\s+[Pp]ropert(?:y|ies)"'

  # --- Inline comments mentioning MT concepts ---
  - id: "comment_mt"
    label: "Comment: metamorphic test/testing/tests"
    regex: "(?:#|//).*\\bmetamorphic\\s+test(?:ing|s)?\\b"
    flags: "IGNORECASE"

  - id: "comment_mr"
    label: "Comment: metamorphic relation/relationship"
    regex: "(?:#|//).*\\bmetamorphic\\s+relation(?:s|ship|ships)?\\b"
    flags: "IGNORECASE"

  - id: "comment_mg"
    label: "Comment: metamorphic group/groups"
    regex: "(?:#|//).*\\bmetamorphic\\s+groups?\\b"
    flags: "IGNORECASE"

  - id: "comment_mp"
    label: "Comment: metamorphic property/properties"
    regex: "(?:#|//).*\\bmetamorphic\\s+propert(?:y|ies)\\b"
    flags: "IGNORECASE"

  # --- Uppercase abbreviations (case-sensitive, non-word boundaries) ---
  - id: "abbrev_MT"
    label: "Abbreviation: MT (metamorphic testing)"
    regex: "(?<![A-Za-z0-9])MT(?![A-Za-z0-9])"

  - id: "abbrev_MR"
    label: "Abbreviation: MR (metamorphic relation)"
    regex: "(?<![A-Za-z0-9])MR(?![A-Za-z0-9])"

# -------------------------------------------------------------------
# NLTK lemmatization second pass (catches inflected forms in comments/strings)
# Set trigger to "" to disable.
# -------------------------------------------------------------------
lemmatization:
  trigger: "metamorphic"
  concept_lemmas:
    test:     "metamorphic testing"
    relation: "metamorphic relation"
    group:    "metamorphic group"
    property: "metamorphic property"

