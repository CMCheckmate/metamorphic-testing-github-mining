services:
  pipeline:
    build: .
    env_file:
      - path: .env
        required: false          # allows running without .env (e.g. GITHUB_TOKEN in shell)
    environment:
      - GITHUB_TOKEN             # also picked up from host shell if set there
    volumes:
      - ./results:/app/results   # persist search/analysis/report output
      - ./inputs:/app/inputs:ro  # keyword files — read-only inside container
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
    # Override the command at runtime:
    #   docker compose run --rm pipeline --technique mt
    #   docker compose run --rm pipeline --technique mt --phase analysis --workers 4
